# Skaffold v4 combines rendered manifests under `manifests` and applies them with a deployer.
# See https://skaffold.dev/docs/references/yaml/ (schema / anchors / multi-config `---`)
# and https://skaffold.dev/docs/deployers/kubectl/ (`deploy.kubectl` applies rendered output).
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: openshell
build:
  local:
    push: false
deploy:
  helm:
    releases:
      - name: cert-manager
        repo: https://charts.jetstack.io
        remoteChart: cert-manager
        version: v1.20.2
        namespace: cert-manager
        createNamespace: true
        setValues:
          crds.enabled: true
      - name: openshell
        chartPath: .
        valuesFiles:
          - values.yaml
          - values-cert-manager.yaml
        createNamespace: true
        namespace: openshell
