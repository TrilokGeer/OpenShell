# Local dev: builds gateway + supervisor images using Docker with a full Rust
# compilation stage (deploy/docker/Dockerfile.dev — no pre-staged binaries needed).
#
# Run from repo root:
#   skaffold dev -f deploy/helm/openshell/skaffold.yaml
#
# See https://skaffold.dev/docs/deployers/helm/ (setValueTemplates, IMAGE_* fields).
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: openshell
build:
  local:
    push: false
  tagPolicy:
    inputDigest: {}
  artifacts:
    - image: openshell/gateway
      context: ../../..
      docker:
        dockerfile: deploy/docker/Dockerfile.dev
        target: gateway
    - image: openshell/supervisor
      context: ../../..
      docker:
        dockerfile: deploy/docker/Dockerfile.dev
        target: supervisor
deploy:
  helm:
    releases:
      - name: cert-manager
        repo: https://charts.jetstack.io
        remoteChart: cert-manager
        version: v1.20.2
        namespace: cert-manager
        createNamespace: true
        setValues:
          crds.enabled: true
      # Envoy Gateway — Kubernetes Gateway API implementation.
      # Installs the Gateway API CRDs and the "eg" GatewayClass.
      # Required when httpRoute.enabled is true in the openshell release.
      - name: envoy-gateway
        repo: https://gateway.envoyproxy.io
        remoteChart: gateway-helm
        version: v1.7.2
        namespace: envoy-gateway-system
        createNamespace: true
        # wait ensures Gateway API CRDs are registered before the openshell
        # release attempts to create Gateway and HTTPRoute resources.
        wait: true
      - name: openshell
        chartPath: .
        namespace: openshell
        createNamespace: true
        valuesFiles:
          - values.yaml
          - values-cert-manager.yaml
          - values-skaffold.yaml
          # To enable OIDC with a local Keycloak instance, run the one-time
          # setup task first, then uncomment the line below:
          #   mise run keycloak:k8s:setup
          #- values-keycloak.yaml
          # To enable Traefik Ingress (k3s built-in, no extra install needed):
          #- values-ingress.yaml
          # To enable the Gateway API HTTPRoute (requires Envoy Gateway above):
          #- values-gateway.yaml
        setValueTemplates:
          image.repository: '{{.IMAGE_REPO_openshell_gateway}}'
          image.tag: '{{.IMAGE_TAG_openshell_gateway}}'
          server.supervisorImage: '{{.IMAGE_FULLY_QUALIFIED_openshell_supervisor}}'
