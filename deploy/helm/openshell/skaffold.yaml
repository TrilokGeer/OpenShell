# Skaffold v4 combines rendered manifests under `manifests` and applies them with a deployer.
# See https://skaffold.dev/docs/references/yaml/ (schema / anchors / multi-config `---`)
# and https://skaffold.dev/docs/deployers/kubectl/ (`deploy.kubectl` applies rendered output).
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: openshell
build:
  local:
    push: false
manifests:
  rawYaml:
    - ../../kube/manifests/openshell-namespace.yaml
    - ../../kube/manifests/agent-sandbox.yaml
  helm:
    releases:
      - name: openshell
        chartPath: .
        valuesFiles:
          - values.yaml
        createNamespace: true
        namespace: openshell
deploy:
  kubectl: {}
