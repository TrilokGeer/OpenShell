{{- if and .Values.grpcRoute.enabled .Values.grpcRoute.createGateway }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ default (include "openshell.fullname" .) .Values.grpcRoute.gatewayName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.grpcRoute.gatewayClassName }}
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
