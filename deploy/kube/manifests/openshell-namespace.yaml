# Ensures the gateway release namespace exists when deploying with Skaffold's
# kubectl deployer (`manifests` + `deploy.kubectl`). Helm's createNamespace is
# honored for `helm install`, not for rendered YAML applied via kubectl.

apiVersion: v1
kind: Namespace
metadata:
  name: openshell
